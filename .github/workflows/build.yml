# Every push to main builds a test copy of the app (kept as a download on the run).
# A tag like v0.1 builds the signed app and publishes it as a release, which is
# what Obtainium installs. Signing needs four repository secrets:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Build test copy
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: gradle --no-daemon testDebugUnitTest assembleDebug -PversionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: meditation-bell-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Build signed release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          gradle --no-daemon testDebugUnitTest assembleRelease \
            -PversionCode=${{ github.run_number }} -PversionName="${GITHUB_REF_NAME#v}"
          mv app/build/outputs/apk/release/app-release.apk "meditation-bell-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: meditation-bell-*.apk
